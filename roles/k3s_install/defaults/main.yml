---
k3s_version: v1.31.4+k3s1
k3s_role: server  # "server" or "agent"

# Network CIDRs — must match the values in the docs
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Disable built-in ServiceLB in favor of MetalLB
k3s_disable:
  - servicelb

# Server URL for agent nodes to join (only used when k3s_role=agent)
k3s_server_url: ""
k3s_token: ""
