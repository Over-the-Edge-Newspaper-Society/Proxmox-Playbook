apiVersion: v1
kind: ServiceAccount
metadata:
  name: zoer-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zoer-backend
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Claiming a standby browser shortens its existing pod deadline.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["update"]
  # Independent agent runners own their private network boundary.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zoer-backend
subjects:
  - kind: ServiceAccount
    name: zoer-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zoer-backend
---
# The current host checks available capacity before admitting plugin workers.
# This matches Zoer's read-only capacity diagnostics; no secret/workload writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zoer-capacity-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zoer-capacity-reader
subjects:
  - kind: ServiceAccount
    name: zoer-backend
    namespace: zoer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zoer-capacity-reader
