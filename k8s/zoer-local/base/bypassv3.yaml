# In-cluster reCAPTCHA v3 token generator for authorized Zoer-backend testing.
#
# The service wraps the vendored BypassV3 library (Apache-2.0,
# see k8s/zoer-local/base/bypassv3/NOTICE.md and scripts/bypassv3/).
# It is NOT a browser: it calls Google's recaptcha anchor/reload endpoints
# over HTTP from inside the cluster and returns a token. The CloakBrowser
# and BlitzBrowser pods are deliberately untouched; their automation can
# call this service (POST http://zoer-bypassv3:8080/token) to obtain a token
# when driving a Zoer-owned test app's reCAPTCHA v3 flow.
#
# Image: stock python:3.12-slim. The Python code is mounted from the
# kustomize-generated ConfigMap `zoer-bypassv3-app`. requests is installed
# on pod start from the pinned requirements.txt; this needs egress to PyPI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoer-bypassv3
  labels:
    app: zoer-bypassv3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zoer-bypassv3
  template:
    metadata:
      labels:
        app: zoer-bypassv3
    spec:
      containers:
        - name: service
          # Multi-arch python:3.12-slim pinned to the 2026-11-08 push; refresh
          # with `docker buildx imagetools inspect python:3.12-slim` when bumping.
          image: docker.io/library/python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            # Install requests into a writable user-site each start, then exec
            # the service. --no-cache-dir keeps the image small; the pin is in
            # /app/requirements.txt (Kustomize-managed, zoer-bypassv3-app).
            - |
              set -e
              pip install --no-cache-dir --user --disable-pip-version-check -r /app/requirements.txt
              exec python3 /app/server.py
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: app
          configMap:
            name: zoer-bypassv3-app
---
apiVersion: v1
kind: Service
metadata:
  name: zoer-bypassv3
spec:
  type: ClusterIP
  selector:
    app: zoer-bypassv3
  ports:
    - port: 8080
      targetPort: 8080
      name: http
