apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zoer-job-store-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zoer-job-store-schema
data:
  001-schema.sql: |
    CREATE TABLE IF NOT EXISTS jobs (
      id bigserial PRIMARY KEY,
      external_id text NOT NULL UNIQUE,
      title text NOT NULL,
      company text NOT NULL,
      location text NOT NULL DEFAULT '',
      url text NOT NULL DEFAULT '',
      status text NOT NULL DEFAULT 'discovered',
      created_at timestamptz NOT NULL DEFAULT now(),
      updated_at timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS jobs_status_id_idx ON jobs (status, id DESC);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoer-job-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zoer-job-store
  template:
    metadata:
      labels:
        app: zoer-job-store
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: job_store
            - name: POSTGRES_USER
              value: zoer_job_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zoer-app-secret
                  key: JOB_STORE_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "zoer_job_admin", "-d", "job_store"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "zoer_job_admin", "-d", "job_store"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/001-schema.sql
              subPath: 001-schema.sql
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zoer-job-store-data
        - name: schema
          configMap:
            name: zoer-job-store-schema
---
apiVersion: v1
kind: Service
metadata:
  name: zoer-job-store
spec:
  selector:
    app: zoer-job-store
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
