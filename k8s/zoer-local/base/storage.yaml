apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zoer-backend-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-nas
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zoer-convex-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-nas
  resources:
    requests:
      storage: 10Gi
---
# Convex stores SQLite data and requires local filesystem locking semantics.
# Keep the NFS claim above as a retained migration backup until the local copy
# has been validated in production.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zoer-convex-data-local
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
