# T3 Code hosts: <label>.t3.k8s.overtheedgepaper.ca reaches the T3 Code server
# inside that Zoer computer. Zoer's backend proxies HTTP and WebSockets and T3
# Code enforces its own pairing/session auth. Private Traefik address only;
# remote devices reach it over WireGuard. Like *.wp, a second-level wildcard
# needs its own certificate (the *.k8s one cannot cover it).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zoer-t3code-hosts
spec:
  secretName: zoer-t3code-hosts-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - "*.t3.k8s.overtheedgepaper.ca"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zoer-t3code-hosts
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: zoer-t3code-hosts-tls
      hosts:
        - "*.t3.k8s.overtheedgepaper.ca"
  rules:
    - host: "*.t3.k8s.overtheedgepaper.ca"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zoer-backend
                port:
                  number: 4000
