apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zoer

# Isolated plugin workers must run the same host protocol as the backend.
replacements:
  - source:
      kind: Deployment
      name: zoer-backend
      fieldPath: spec.template.spec.containers.[name=backend].image
    targets:
      - select:
          kind: Deployment
          name: zoer-backend
        fieldPaths:
          - spec.template.spec.containers.[name=backend].env.[name=PLUGIN_RUNNER_CONTAINER_IMAGE].value

resources:
  - ../base

# Swap the GHCR images for the ones built on the node and imported into k3s
# containerd. imagePullPolicy is already IfNotPresent in the base, so kubelet
# uses the local image and never contacts a registry.
images:
  - name: ghcr.io/ahzs645/zoer/backend
    newName: docker.io/zoer-local/backend
    newTag: dev-1791206813-a1afbe3
  - name: ghcr.io/ahzs645/zoer/frontend
    newName: docker.io/zoer-local/frontend
    newTag: dev-1791206813-a1afbe3
