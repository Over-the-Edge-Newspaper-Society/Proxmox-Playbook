apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventscrape-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventscrape-admin
  template:
    metadata:
      labels:
        app: eventscrape-admin
    spec:
      containers:
        - name: admin
          # Replaced by the overlay. The image has VITE_CONVEX_URL baked in at
          # build time, so rebuild it if the public Convex hostname changes.
          # WARNING: ':placeholder' is never runnable. The real tag is built on the
          # node and patched in by the deploy script, so it exists only in the
          # LIVE object, not here. A plain `kubectl apply -k` on this base RESETS
          # the tag to :placeholder and the pod goes ImagePullBackOff -- which is
          # exactly how the worker ended up down for 70 minutes. Deploy with the
          # script; to touch only ingress, apply that one file, not the whole base.
          # Recover with:
          #   kubectl -n <ns> set image deploy/<name> '*=<image>:<tag-on-node>'
          #   # list tags: k3s ctr -n k8s.io images ls -q | grep <name>
          image: docker.io/eventscrape-local/admin:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eventscrape-admin
spec:
  selector:
    app: eventscrape-admin
  ports:
    - name: http
      port: 80
      targetPort: 3000
