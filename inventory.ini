# The `ansible` user is deliberately least-privilege: its only sudo grant is
#   ansible ALL=(root) NOPASSWD: /usr/sbin/pct
# which covers the LXC playbooks (10-60) but NOT `qm`, apt, or /etc/exports.
[proxmox]
pve ansible_host=10.70.20.10 ansible_user=ansible

# The K3s playbooks (70-80) need `qm`, package installs and NFS exports on the
# host, so they run as root over SSH. See README "K3s prerequisites".
[proxmox_root]
pve-root ansible_host=10.70.20.10 ansible_user=root ansible_ssh_private_key_file=~/.ssh/personalprox_pve_ed25519

# The Kubernetes node itself, created by 80-create-k3s-cluster.yml.
[k3s]
k3s-node-1 ansible_host=10.70.20.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/personalprox_pve_ed25519
