# Sets up the NFS export that backs every PersistentVolume in the cluster.
#
#   ansible-playbook playbooks/75-setup-k8s-nfs-export.yml
#
# MUST run before 80-create-k3s-cluster.yml, because that playbook makes
# `nfs-nas` the default StorageClass. If this export does not exist, every PVC
# in the cluster hangs in Pending forever with no obvious error.
#
# Mount the OTE data volume at /mnt/nas-k8s first. See docs/KUBERNETES.md.
- name: Export /mnt/nas-k8s to the K3s node
  hosts: proxmox_root
  gather_facts: false
  vars:
    nfs_export_path: /mnt/nas-k8s
    nfs_client: 10.70.20.50/32
    nfs_options: rw,sync,no_subtree_check,no_root_squash,mountpoint

  tasks:
    - name: Install nfs-kernel-server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Verify that the data filesystem is mounted
      ansible.builtin.command:
        argv: [mountpoint, -q, "{{ nfs_export_path }}"]
      changed_when: false
      check_mode: false

    - name: Create the NFS service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/nfs-server.service.d
        state: directory
        mode: "0755"

    - name: Order the NFS server after the storage mount
      ansible.builtin.copy:
        dest: /etc/systemd/system/nfs-server.service.d/zoer-storage.conf
        content: |
          [Unit]
          RequiresMountsFor={{ nfs_export_path }}
        mode: "0644"
      register: nfs_mount_dependency

    - name: Reload the NFS service dependency
      ansible.builtin.systemd:
        daemon_reload: true
      when: nfs_mount_dependency.changed

    # no_root_squash is required so the NFS CSI driver can chown the
    # per-volume directories it provisions.
    - name: Declare the export
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: "^{{ nfs_export_path }}\\s"
        line: "{{ nfs_export_path }} {{ nfs_client }}({{ nfs_options }})"
        create: true
      notify: Reload exports

    - name: Enable and start nfs-kernel-server
      ansible.builtin.systemd:
        name: nfs-kernel-server
        enabled: true
        state: started

  handlers:
    - name: Reload exports
      ansible.builtin.command: exportfs -ra
      changed_when: true
