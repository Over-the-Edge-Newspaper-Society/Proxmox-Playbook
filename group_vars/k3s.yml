---
# Overrides for the [k3s] inventory group. Everything here has a default in the
# corresponding role; values are repeated only where the role default would be
# wrong for this host or this network.

# roles/k3s_install/defaults/main.yml
k3s_version: v1.31.4+k3s1
k3s_cluster_cidr: 10.42.0.0/16   # pod network, internal to the cluster
k3s_service_cidr: 10.43.0.0/16   # service network, internal to the cluster
k3s_disable:
  - servicelb                    # replaced by MetalLB

# roles/k3s_base_services/defaults/main.yml
#
# MetalLB hands out these as LoadBalancer IPs. They sit at the top of the same
# flat 10.70.20.0/24 the LXC stack uses.
#
# PREREQUISITE: the UniFi DHCP pool must be capped below .240, or MetalLB will
# assign addresses DHCP can also lease. The resulting failures are intermittent
# and very hard to diagnose.
metallb_address_range: 10.70.20.240-10.70.20.250

# NFS backing for PersistentVolumes. Created by 75-setup-k8s-nfs-export.yml.
nfs_server: 10.70.20.10
nfs_path: /mnt/nas-k8s
